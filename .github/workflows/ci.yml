name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Segurança (varredura anti-segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Varre todo o repositório por credenciais/keys/ARNs de conta real.
      - name: Varredura anti-segredos
        run: bash scripts/secret-scan.sh

  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint/sintaxe (compileall)
        run: python -m compileall -q app scripts tests

      - name: Testes (pytest)
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Testes unitários (headless)
        run: npm run test:ci

  infra:
    name: Infra CDK (synth + cdk-nag)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Instalar dependências da stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # synth não faz docker build (assets de imagem são construídos só no deploy);
      # roda o cdk-nag como gate de governança.
      - name: cdk synth (com cdk-nag)
        run: cdk synth -c nag=true
