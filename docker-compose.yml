version: '3.8'

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: condoguard-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: condopassword123
      POSTGRES_DB: condoguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
